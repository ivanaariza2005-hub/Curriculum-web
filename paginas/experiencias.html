<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Experiencias Profesionales</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/experiencias.css"/>
</head>
<body>

<header>
  <h1>CV <span>API</span> — Experiencias Profesionales</h1>
  <div class="header-right">
    <button class="btn-login-header" id="loginBtnHeader" onclick="mostrarLogin()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Iniciar Sesión
    </button>
    <div class="user-info" id="userInfo" style="display:none">
      <span class="user-avatar" id="userAvatar">D</span>
      <span class="user-name" id="userName"></span>
      <button class="btn-logout" onclick="logout()" title="Cerrar sesión">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <div class="api-status">
      <div class="dot"></div>
      <span id="api-url-label">API en línea</span>
    </div>
  </div>
</header>

<div class="container">

  <!-- ── Formulario ── -->
  <div class="panel">
    <div class="panel-title">
      <span id="form-title">Nueva Experiencia</span>
      <span class="badge" id="form-badge">POST</span>
    </div>

    <input type="hidden" id="edit-id" />

    <div id="formBody">
      <div class="form-group" id="personaGroup">
        <label>Persona</label>
        <select id="persona">
          <option value="">Selecciona...</option>
          <option>Daniela</option>
          <option>Ivan</option>
          <option>Keila</option>
          <option>Yeison</option>
        </select>
      </div>

      <div class="form-group" id="personaFixed" style="display:none">
        <label>Persona</label>
        <div class="persona-fixed" id="personaDisplay"></div>
      </div>

      <div class="form-group">
        <label>Empresa</label>
        <input type="text" id="empresa" placeholder="Nombre de la empresa" />
      </div>

      <div class="form-group">
        <label>Cargo</label>
        <input type="text" id="cargo" placeholder="Tu cargo o rol" />
      </div>

      <div class="row2">
        <div class="form-group">
          <label>Fecha Inicio</label>
          <input type="date" id="fechaInicio" />
        </div>
        <div class="form-group">
          <label>Fecha Fin</label>
          <input type="date" id="fechaFin" />
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="trabajoActual" onchange="toggleFechaFin()" />
        <label for="trabajoActual">Trabajo actual (sin fecha fin)</label>
      </div>

      <div class="form-group">
        <label>Ciudad</label>
        <input type="text" id="ciudad" placeholder="Ciudad" />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea id="descripcion" placeholder="¿Qué hacías en ese trabajo?"></textarea>
      </div>
    </div>

    <div id="authBanner" class="auth-banner">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>Inicia sesión para crear y editar experiencias</span>
      <button class="btn-login-prompt" onclick="mostrarLogin()">Iniciar Sesión</button>
    </div>

    <div id="formActions">
      <button class="btn btn-primary" onclick="guardar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar Experiencia
      </button>
      <button class="btn btn-secondary" onclick="cancelarEdicion()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Cancelar
      </button>
    </div>
  </div>

  <!-- ── Lista ── -->
  <div class="right-panel">

    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-daniela" style="color:#6c63ff">0</div>
        <div class="stat-label">Daniela</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-ivan" style="color:#ff6584">0</div>
        <div class="stat-label">Ivan</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-keila" style="color:#43e97b">0</div>
        <div class="stat-label">Keila / Yeison</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filtrar('', this)">Todos</button>
      <button class="filter-btn" onclick="filtrar('Daniela', this)">Daniela</button>
      <button class="filter-btn" onclick="filtrar('Ivan', this)">Ivan</button>
      <button class="filter-btn" onclick="filtrar('Keila', this)">Keila</button>
      <button class="filter-btn" onclick="filtrar('Yeison', this)">Yeison</button>
    </div>

    <div id="lista"><div class="loading">Cargando experiencias...</div></div>
  </div>
</div>

<div id="toast"></div>

<!-- ── Login Modal ── -->
<div id="loginModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Acceso Desarrolladores
      </div>
      <button class="modal-close" onclick="ocultarLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="modal-desc">Selecciona tu perfil e ingresa tu contraseña para gestionar las experiencias.</p>
    <div class="modal-body">
      <div class="form-group">
        <label>Desarrollador</label>
        <select id="loginPersona">
          <option value="">Selecciona...</option>
          <option value="daniela">Daniela</option>
          <option value="ivan">Ivan</option>
          <option value="keila">Keila</option>
          <option value="yeison">Yeison</option>
        </select>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" onkeydown="if(event.key==='Enter')login()" />
      </div>
      <div id="loginError" class="login-error"></div>
      <button class="btn btn-primary" onclick="login()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Ingresar
      </button>
    </div>
  </div>
</div>

<script src="../js/experiencias.js"></script>
</body>
</html>
